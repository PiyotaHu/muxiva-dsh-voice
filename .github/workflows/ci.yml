name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm test
      - run: npm run pack:smoke
      - run: python -m compileall -q python .muxiva/nodes

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate model lock shape
        run: |
          jq -e '.version == 1 and (.models | length == 5)' models.lock.json
          jq -e 'all(.models[]; (.sha256 | test("^[0-9a-f]{64}$")) and (.url | startswith("https://")))' models.lock.json

  browser-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/check-package.mjs
      - name: Ensure npm install has no lifecycle scripts
        run: '! jq -e ''.scripts.prepare or .scripts.preinstall or .scripts.install or .scripts.postinstall'' package.json'
